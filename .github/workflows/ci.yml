name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-pr-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdownlint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          globs: "**/*.md"

  ruff:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          version-file: "pyproject.toml"
          args: "--version"
      - run: ruff check --verbose
      - run: ruff format --check --diff --verbose

  uvlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv lock --check

  basedpyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - name: basedpyright
        run: uv run --frozen --all-extras basedpyright --verbose

  # ========== 单元测试（三平台，跳过 LLM）==========
  unit-tests:
    needs:
      - validate-pr-title
      - markdownlint
      - uvlock
      - ruff
      - basedpyright
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install bison (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "PATH=/opt/homebrew/opt/bison/bin:$PATH" >> $GITHUB_ENV
      - name: Set timezone to UTC+8 (Linux/macOS)
        if: runner.os != 'Windows'
        run: echo "TZ=Asia/Shanghai" >> $GITHUB_ENV

      - name: Set timezone to UTC+8 (Windows)
        if: runner.os == 'Windows'
        run: echo "TZ=China Standard Time" >> $env:GITHUB_ENV
      - name: Setup llama.cpp to PATH
        uses: pbrisbin/setup-tool-action@v2
        with:
          name: llama
          url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/{name}-{version}-bin-{os}-{arch}.{ext}"
          os-win32: win-cpu
          os-linux: ubuntu
          os-darwin: macos
          subdir-linux: "{name}-{version}"
          subdir-darwin: "{name}-{version}"
      - name: Run unit tests
        run: uv run --frozen --all-extras pytest --verbose -m "not llm"
        env:
          TZ: ${{ runner.os == 'Windows' && 'China Standard Time' || 'Asia/Shanghai' }}


  # ========== LLM 测试（仅 Linux，有模型才跑）==========
  llm-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      - name: Set timezone to UTC+8
        run: echo "TZ=Asia/Shanghai" >> $GITHUB_ENV
      - name: Check for LLM model
        id: check-model
        run: |
          if [ -f /opt/models/qwen3-4b-instruct.gguf ]; then
            echo "model_exists=true" >> $GITHUB_OUTPUT
            echo "✅ LLM 模型已挂载"
          else
            echo "model_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ 跳过 LLM 测试：模型未挂载到 /opt/models"
          fi
      - name: Setup llama.cpp to PATH
        if: steps.check-model.outputs.model_exists == 'true'
        uses: pbrisbin/setup-tool-action@v2
        with:
          name: llama
          url: "https://github.com/ggml-org/llama.cpp/releases/download/{version}/{name}-{version}-bin-{os}-{arch}.{ext}"
          os-linux: ubuntu
          subdir-linux: "{name}-{version}"
      - name: Run LLM tests
        if: steps.check-model.outputs.model_exists == 'true'
        run: uv run --frozen --all-extras pytest --verbose -m "llm"
      - name: Skip LLM tests notification
        if: steps.check-model.outputs.model_exists != 'true'
        run: echo "✅ LLM tests skipped (model not found), this is not a failure"
